<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — NDR EDTECH Student Portal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo"><i class="fa-solid fa-graduation-cap"></i></div>
    <h1>NDR EDTECH</h1>
    <p class="subtitle">Student Management Portal — Admin Login</p>

    <div id="expiredNotice" class="alert alert-warning py-2 small d-none">
      Your session expired. Please log in again.
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent"><i class="fa-solid fa-user"></i></span>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required autofocus>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required>
          <button type="button" class="input-group-text bg-transparent" id="togglePassword"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div id="loginError" class="alert alert-danger py-2 small d-none"></div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Login
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">&copy; <span id="year"></span> NDR EDTECH. All rights reserved.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  if (Auth.isLoggedIn()) {
    location.href = 'dashboard.html';
  }

  if (new URLSearchParams(location.search).get('expired') === '1') {
    document.getElementById('expiredNotice').classList.remove('d-none');
  }

  document.getElementById('togglePassword').addEventListener('click', () => {
    const input = document.getElementById('password');
    const icon = document.querySelector('#togglePassword i');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    icon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
  });

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('d-none');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      errorBox.textContent = 'Please enter both username and password.';
      errorBox.classList.remove('d-none');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Logging in...';

    try {
      const result = await Api.login(username, password);
      Auth.saveSession(result);
      Utils.success('Welcome back, ' + result.username + '!');
      setTimeout(() => (location.href = 'dashboard.html'), 500);
    } catch (err) {
      errorBox.textContent = err.message || 'Login failed. Please try again.';
      errorBox.classList.remove('d-none');
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-1"></i> Login';
    }
  });
</script>
</body>
</html>
